name: Publish

on:
  workflow_dispatch:

# Never cancelled mid-flight: a cancelled publish can leave some publications uploaded and others
# not.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    # macos-15 so the iOS targets are built and tested before anything is published.
    runs-on: macos-15
    # This workflow only ever fires via workflow_dispatch, but a dispatch can be run against any
    # ref. Restricting to main keeps a dispatch from a feature branch a no-op instead of a publish.
    # It is not an access control: a dispatch runs the dispatched ref's own copy of this file.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5.0.2
        with:
          cache-disabled: true
      - name: Build and test every macOS-buildable lane
        run: ./gradlew :lib:build

  publish:
    needs: build
    # macos-15 so the iOS klib publications (which cannot be built on ubuntu) are published
    # alongside jvm/android/wasmJs in the same run; free for public GitHub repos.
    runs-on: macos-15
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21
      # Releases are built from a clean Gradle home, never from a cache another run wrote.
      - uses: gradle/actions/setup-gradle@v5.0.2
        with:
          cache-disabled: true
      - name: Publish all publications to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :lib:publishAllPublicationsToGitHubPackagesRepository
