name: Publish

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  publish:
    # macos-15 so the iOS klib publications (which cannot be built on ubuntu) are published
    # alongside jvm/android/wasmJs in the same run; free for public GitHub repos.
    runs-on: macos-15
    # This workflow only ever fires via workflow_dispatch, but a dispatch can be run against any
    # ref. Restricting to main keeps a dispatch from a feature branch a no-op instead of a publish.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build and test every macOS-buildable lane
        run: ./gradlew :lib:build
      - name: Publish all publications to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :lib:publishAllPublicationsToGitHubPackagesRepository
