name: Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths-ignore:
      - docs/KMP-MIGRATION.md
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - PUBLISHING.md
      - AGENTS.md
      - CLAUDE.md

concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: JVM and Android host tests
        run: ./gradlew :lib:jvmTest :lib:testAndroidHostTest :lib:assemble :lib:apiCheck

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Wasm tests
        run: ./gradlew :lib:wasmJsNodeTest

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: iOS simulator tests
        run: ./gradlew :lib:iosSimulatorArm64Test :lib:klibApiCheck

  # The playground compiles lib/src/commonMain/kotlin as a source directory of its own rather than
  # resolving a publication, so this is the only lane that builds the library for a browser. A
  # library change that does not compile on Kotlin/JS would reach main unnoticed without it.
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Playground tests and web bundle
        run: ./gradlew :playground:jsBrowserTest :playground:jsBrowserDistribution
