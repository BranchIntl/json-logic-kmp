name: Pages

on:
  push:
    branches: [ main ]
    paths-ignore:
      - docs/KMP-MIGRATION.md
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - PUBLISHING.md
      - AGENTS.md
      - CLAUDE.md
  # Redeploys the current main without an empty commit, needed once after Pages is enabled.
  workflow_dispatch:

# pages:write and id-token:write are what deploy-pages needs to mint its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancelled mid-flight: a half-cancelled deploy can leave the site indeterminate.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Named once, so the step that checks the directory and the step that uploads it cannot come
    # to describe two different directories.
    env:
      DISTRIBUTION: playground/build/dist/js/productionExecutable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      # Only here to fail legibly, at this step, when Pages has not been enabled.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the playground distribution
        run: ./gradlew :playground:jsBrowserDistribution
      # The development bundle lands beside this one and carries an index.html of its own, so the
      # page existing proves nothing about which build produced it. Minification does: the
      # production bundle is one line, and the development bundle is a hundred.
      - name: Check the distribution is the minified one
        run: |
          test -f "$DISTRIBUTION/index.html"
          test "$(wc -l < "$DISTRIBUTION/playground.js")" -le 2
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.DISTRIBUTION }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
